name: Deploy Function App

on:
  push:
    branches:
      - develop
    paths:
      - "src/Functions/**"
      - ".github/workflows/deploy-function.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-function:
    name: Build and Deploy Function App
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/Functions/Functions.csproj

      - name: Build
        run: dotnet build src/Functions/Functions.csproj --configuration Release --no-restore

      - name: Publish Function App
        run: |
          dotnet publish src/Functions/Functions.csproj \
            --configuration Release \
            --output ./publish/function

      - name: Deploy Function App to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: event-platform-func-scott-dev
          package: ./publish/function
